name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "v0.[0-9]+.[0-9]+"
      - "v1.[0-9]+.[0-9]+"

env:
  GO_VERSION: 1.26
  GO_RELEASER_VERSION: v2.15.2
  
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - uses: step-security/harden-runner@v2.15.1
      with:
        egress-policy: audit
    - uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    - uses: sigstore/cosign-installer@v4.1.1
    - name: Login to GitHub Container Registry to allow cosign signature push
      run: echo "$DOCKER_PASSWORD" | docker login ghcr.io --username "$DOCKER_USERNAME" --password-stdin
      env:
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7.0.0
      with:
        distribution: goreleaser
        version: ${{ env.GO_RELEASER_VERSION }} # Not pinnable by hash, nor does it verify its signature
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
